    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var safeFn = function() {
          var fn = this.webkitRequestPointerLock || this.mozRequestPointerLock;
          if (typeof fn === 'function') {
            try { return fn.call(this); } catch(e) { console.warn(e); }
          }
        };
        if (typeof Element !== 'undefined' && !Element.prototype.requestPointerLock) {
          Element.prototype.requestPointerLock = safeFn;
        }
        if (typeof Document !== 'undefined' && !Document.prototype.requestPointerLock) {
          Document.prototype.requestPointerLock = function() {
            var el = document.body || document.documentElement;
            return el && el.requestPointerLock && el.requestPointerLock();
          };
        }
      })();
    </script>
